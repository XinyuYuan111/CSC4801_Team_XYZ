{% extends "base.html" %}
{% block title %}My Profile · TalentMatch{% endblock %}
{% block content %}
<h1>My profile</h1>
<div class="card">
  {% if error %}<p class="error-text">{{ error }}</p>{% endif %}
  <form method="post" action="{{ url_for('candidate.profile') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="display_name">Display name</label>
    <input id="display_name" name="display_name" type="text" value="{{ profile.display_name }}" required>
    <label for="skills">Technical skills (comma separated — used for match scores)</label>
    <textarea id="skills" name="skills">{{ profile.skills | join(', ') }}</textarea>
    <div class="actions">
      <button class="btn" type="submit">Save profile</button>
    </div>
  </form>
</div>

<h2>Resume</h2>
<div class="card">
  <p class="muted">Resumes are private: only you can read or replace your resume.</p>
  <div class="actions">
    <a class="btn" href="{{ url_for('candidate.resume', candidate_id=profile.user_id) }}">View / edit resume</a>
  </div>
</div>
{% endblock %}
