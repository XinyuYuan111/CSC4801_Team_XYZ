{% extends "base.html" %}
{% block title %}Company Profile · TalentMatch{% endblock %}
{% block content %}
<h1>Company profile</h1>
<div class="card">
  {% if error %}<p class="error-text">{{ error }}</p>{% endif %}
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="company_name">Company name</label>
    <input id="company_name" name="company_name" type="text" value="{{ company.company_name }}" required>
    <label for="description">Description</label>
    <textarea id="description" name="description">{{ company.description }}</textarea>
    <div class="actions">
      <button class="btn" type="submit">Save company profile</button>
    </div>
  </form>
</div>
{% endblock %}
