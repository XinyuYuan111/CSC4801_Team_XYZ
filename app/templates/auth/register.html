{% extends "base.html" %}
{% block title %}Register · TalentMatch{% endblock %}
{% block content %}
<h1>Create an account</h1>
<div class="card">
  {% if error %}<p class="error-text">{{ error }}</p>{% endif %}
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="role">I am a</label>
    <select id="role" name="role" required>
      <option value="Candidate">Candidate</option>
      <option value="Employer">Employer</option>
    </select>
    <label for="email">Email</label>
    <input id="email" name="email" type="email" required>
    <label for="password">Password (at least 8 characters)</label>
    <input id="password" name="password" type="password" minlength="8" required>
    <label for="display_name">Display name (candidates)</label>
    <input id="display_name" name="display_name" type="text">
    <label for="company_name">Company name (employers)</label>
    <input id="company_name" name="company_name" type="text">
    <div class="actions">
      <button class="btn" type="submit">Register</button>
      <a class="btn secondary" href="{{ url_for('auth.login') }}">Back to log in</a>
    </div>
  </form>
</div>
{% endblock %}
